version: "2"

run:
  timeout: 5m

linters:
  enable:
    - misspell
    - bodyclose
    - unconvert
  settings:
    staticcheck:
      checks:
        - all
        - -QF1003
        - -ST1003
        - -ST1000
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
